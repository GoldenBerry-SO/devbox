---
# The agent stack: herdr (persistent remote agent sessions), Claude Code, Codex,
# pi, ccstatusline, graphify, plus Chrome + a shared Playwright Chromium for
# headless browser testing. Enabled by features.agent (default true).

- name: Install herdr
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://herdr.dev/install.sh | HOME=/tmp/herdr-install sh
    find /tmp/herdr-install -name herdr -type f -exec mv {} /usr/local/bin/herdr \;
    chmod +x /usr/local/bin/herdr
    rm -rf /tmp/herdr-install
  args:
    executable: /bin/bash
    creates: /usr/local/bin/herdr

# state: latest so every ./up pulls the current release, not just a first-run
# install. The nightly-refresh timer keeps them current between rebuilds too.
- name: Agent CLIs (global npm, always latest)
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
  loop:
    - "@anthropic-ai/claude-code"
    - "@openai/codex"
    - ccstatusline

# pi (earendil-works) — terminal coding agent; the command is `pi`. Its own
# docs install with --ignore-scripts for supply-chain safety (it ships a
# prebuilt bin, so no postinstall is needed).
- name: Install the pi coding agent (global, latest)
  community.general.npm:
    name: "@earendil-works/pi-coding-agent"
    global: true
    state: latest
    ignore_scripts: true

# graphify — turns a repo (code, docs, PDFs) into a queryable knowledge graph
# for the AI assistants. Package is 'graphifyy' (double-y is the official one;
# other graphify* packages are typosquats), CLI is 'graphify'. Installed via uv
# (from dev_tools) into a shared tool dir with the shim on the system PATH.
- name: Install graphify (knowledge-graph CLI)
  ansible.builtin.command: uv tool install graphifyy
  args:
    creates: /usr/local/bin/graphify
  environment:
    UV_TOOL_DIR: /opt/uv-tools
    UV_TOOL_BIN_DIR: /usr/local/bin

- name: Browsers for headless testing
  when: features.browsers | default(true)
  block:
    - name: Google Chrome keyring
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/linux_signing_key.pub
        dest: /etc/apt/keyrings/google-chrome.asc
        mode: "0644"

    - name: Google Chrome repo
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.asc] https://dl.google.com/linux/chrome/deb/ stable main"
        filename: google-chrome
        state: present

    - name: Install google-chrome-stable
      ansible.builtin.apt:
        name: google-chrome-stable
        update_cache: true
        state: present

    # The Playwright CLI itself (playwright codegen / test / open / screenshot),
    # global so it's a real command on PATH for every user, not npx-on-demand.
    - name: Install the Playwright CLI (global, latest)
      community.general.npm:
        name: playwright
        global: true
        state: latest

    # Browsers in a SHARED path so every user/agent finds them without a
    # per-user download. .links must be writable too — playwright registers the
    # calling package there before downloading. Uses the CLI just installed.
    - name: Install Playwright Chromium into a shared cache
      ansible.builtin.shell: |
        set -o pipefail
        export PLAYWRIGHT_BROWSERS_PATH=/usr/local/ms-playwright
        playwright install --with-deps chromium
      args:
        executable: /bin/bash
        creates: /usr/local/ms-playwright

    - name: Make the shared playwright cache world-writable (sticky, like /tmp)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "1777"
      loop:
        - /usr/local/ms-playwright
        - /usr/local/ms-playwright/.links

    - name: Export PLAYWRIGHT_BROWSERS_PATH for all shells
      ansible.builtin.copy:
        dest: /etc/profile.d/playwright.sh
        mode: "0644"
        content: "export PLAYWRIGHT_BROWSERS_PATH=/usr/local/ms-playwright\n"

    - name: …and for zsh non-login shells
      ansible.builtin.lineinfile:
        path: /etc/zsh/zshenv
        line: 'export PLAYWRIGHT_BROWSERS_PATH=/usr/local/ms-playwright'
        create: true
        mode: "0644"
